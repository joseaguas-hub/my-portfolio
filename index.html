<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Aguas | Inteligencia Artificial</title>
    <style>
        /* 1. CONFIGURACIÓN GENERAL ESTILO PURE BLACK */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 2. LA CHINCHETA: POSICIONAMIENTO DEL LOGO */
        .navbar {
            position: fixed; /* Se queda clavado arriba */
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-start; /* Alinea el contenido a la izquierda */
            align-items: center;
            z-index: 1000; /* Asegura que siempre flote por encima de todo */
        }
        .logo-img {
            height: 60px; /* Tamaño elegante para la esquina */
            width: auto;
            mix-blend-mode: screen; /* Truco de IA: oculta el fondo blanco de la imagen */
            transition: transform 0.3s ease;
        }
        .logo-img:hover {
            transform: scale(1.05); /* Sutil dinamismo al pasar el ratón */
        }

        /* 3. CONTENIDO CENTRAL */
        .hero-container {
            text-align: center;
            padding: 20px;
            margin-top: 60px; /* Espacio para que no choque con el logo */
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.4rem;
            color: #86868b;
            margin-bottom: 40px;
        }
        .btn-apple {
            display: inline-block;
            background-color: #0071e3;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 980px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .btn-apple:hover {
            background-color: #147ce5;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Barra superior con tu nuevo logo -->
    <nav class="navbar">
        <img src="logo.png" alt="Logo José Aguas" class="logo-img">
    </nav>

    <!-- Escaparate principal -->
    <div class="hero-container">
        <h1>José Aguas</h1>
        <p>Construyendo el futuro digital con Inteligencia Artificial</p>
        <a href="#" class="btn-apple">Explorar Proyectos</a>
    </div>

</body>
</html>
