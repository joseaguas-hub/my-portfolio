<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Aguas | Portafolio</title>
    <style>
        /* 1. RESETEO Y FONDO (Estilo Apple Pro) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000; /* Negro puro */
            color: #f5f5f7; /* Blanco suave, no deslumbra */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;     /* Centra verticalmente */
            min-height: 100vh;       /* Ocupa el 100% de la altura de la pantalla */
            overflow: hidden;
        }

        /* 2. CONTENEDOR PRINCIPAL */
        .hero-container {
            text-align: center;
            padding: 20px;
        }

        /* 3. TIPOGRAFÍA REFINADA */
        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; /* Efecto de texto metalizado */
        }
        p {
            font-size: 1.4rem;
            color: #86868b; /* Gris Apple para textos secundarios */
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
        }

        /* 4. BOTÓN INTERACTIVO */
        .btn-apple {
            display: inline-block;
            background-color: #0071e3; /* Azul oficial de Apple */
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 980px; /* Bordes completamente redondeados */
            font-size: 1rem;
            font-weight: 400;
            transition: all 0.3s ease; /* Transición suave para la animación */
        }
        .btn-apple:hover {
            background-color: #147ce5; /* Se aclara un poco al pasar el ratón */
            transform: scale(1.05);    /* Crece un 5% sutilmente */
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1>José Aguas</h1>
        <p>Construyendo el futuro digital con Inteligencia Artificial</p>
        <a href="#" class="btn-apple">Explorar Proyectos</a>
    </div>

</body>
</html>
