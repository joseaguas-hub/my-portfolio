<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Aguas | Inteligencia Artificial</title>
    <style>
        /* 1. CONFIGURACIÓN GENERAL Y FONDO ACERO OSCURO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0f12; /* Gris oscuro metalizado extraído de tu logo */
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 2. BARRA DE NAVEGACIÓN Y LOGO MÁS GRANDE */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 1000;
        }
        .logo-img {
            height: 90px; /* ¡Logo un poco más grande y vistoso! */
            width: auto;
            mix-blend-mode: screen; /* Sigue fusionando el fondo blanco de la imagen */
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-img:hover {
            transform: scale(1.06) rotate(-1deg); /* Sutil giro tecnológico al pasar el ratón */
        }

        /* 3. CONTENIDO CENTRAL CON DEGRADADO COBRE */
        .hero-container {
            text-align: center;
            padding: 20px;
            margin-top: 80px;
        }
        h1 {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            /* Degradado de blanco platino a bronce cobrizo */
            background: linear-gradient(180deg, #ffffff 30%, #ad8762 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.4rem;
            color: #8da2b4; /* Gris azulado suave que simula las pistas del circuito */
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
        }

        /* 4. BOTÓN PERSONALIZADO CON COLORES DEL LOGO */
        .btn-custom {
            display: inline-block;
            background: linear-gradient(135deg, #ad8762 0%, #705338 100%); /* Cobre pulido */
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 980px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 15px rgba(173, 135, 98, 0.2); /* Sutil brillo cobrizo inferior */
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #cbb493 0%, #ad8762 100%); /* Cambia a dorado metalizado */
            transform: translateY(-3px) scale(1.03); /* Flota ligeramente hacia arriba */
            box-shadow: 0 8px 25px rgba(203, 180, 147, 0.4); /* El brillo se intensifica */
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <img src="logo.png" alt="Logo José Aguas" class="logo-img">
    </nav>

    <div class="hero-container">
        <h1>José Aguas</h1>
        <p>Construyendo el futuro digital con Inteligencia Artificial</p>
        <a href="#" class="btn-custom">Explorar Proyectos</a>
    </div>

</body>
</html>
